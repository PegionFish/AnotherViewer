# ===========================================================================
# AnotherViewer Web — LAN 内网 HTTPS 反代（PWA 轨道 B）
#
# 用途：在 141（192.168.6.141）上挂 mkcert 签发的证书监听 :8443，反代本机
#       8081 的 anotherviewer-web，为 LAN 内浏览器提供安全上下文（PWA 安装 /
#       Service Worker 需要）。HTTP 8081 原样保留——Android App 与既有客户端
#       零扰动；停掉本反代即回滚，8081 全程未被改动。
#
# 证书：由 scripts/gen-lan-cert.sh 生成到 deploy/certs/（PEM；该目录已加入
#       .gitignore，私钥不入库）。
# 注意：与 deploy/Caddyfile 的分工——deploy/Caddyfile 面向公网域名（Caddy 自
#       动获取 Let's Encrypt 证书，监听 443）；本文件面向 LAN 无域名场景
#       （mkcert 本地证书，监听 8443），两者二选一。
#
# 使用：
#   sudo cp deploy/caddy-anotherviewer.conf /etc/caddy/Caddyfile
#   sudo systemctl reload caddy
#   或以独立实例运行（步骤见 docs/deployment.md「HTTPS 轨道 B」一节）：
#   caddy run --config deploy/caddy-anotherviewer.conf
# 部署时建议把下方 tls 两行改为绝对路径（caddy 以工作目录解析相对路径），如：
#   tls /server/AnotherViewer/deploy/certs/anotherviewer-lan.pem \
#       /server/AnotherViewer/deploy/certs/anotherviewer-lan-key.pem
#
# 说明：Caddy reverse_proxy 原生透传 WebSocket 升级，/ws（SockJS）无需任何
#       额外配置。
# ===========================================================================

:8443 {
	tls deploy/certs/anotherviewer-lan.pem deploy/certs/anotherviewer-lan-key.pem
	reverse_proxy 127.0.0.1:8081
}
